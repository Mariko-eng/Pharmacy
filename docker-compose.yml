version: '3.4'
services:
  web:
    build: .
    platform: "linux/amd64"
    image: yigamarkgabriel333288/pharmacy_prod:latest #  Production
    container_name: "pharmacy_sys_prod"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - 8000
    # ports:
    #   - 8000:8000
    env_file:
      - ./.env/prod.env

  nginx:
    build:
      context: ./nginx/
    image: yigamarkgabriel333288/pharmacy_sys_nginx:latest
    container_name: "pharmacy_sys_nginx"
    ports:
      - 80:80
    depends_on:
      - web
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - static_volume:/app/static
      - media_volume:/app/media

volumes:
  static_volume:
  media_volume: